<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300">
  <defs>
    <radialGradient id="crt" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#06180c"/>
      <stop offset="70%" stop-color="#020a05"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#000" opacity="0.35"/>
    </pattern>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#39ff7a" stop-opacity="0"/>
      <stop offset="100%" stop-color="#39ff7a" stop-opacity="0.45"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .t { font-family: 'Courier New', Courier, monospace; fill: #39ff7a; }
      .dim { fill: #1f8f47; }
      .amber { fill: #ffb000; }
      .blink { animation: blink 1s steps(1) infinite; }
      .flick { animation: flick 4s infinite; }
      .rot { transform-origin: 830px 150px; animation: spin 4s linear infinite; }
      .ping { transform-origin: 862px 118px; animation: ping 4s ease-out infinite; }
      .ufo { animation: hover 3s ease-in-out infinite; }
      .star { animation: tw 2.5s ease-in-out infinite; }
      .s2 { animation-delay: .8s; } .s3 { animation-delay: 1.6s; }
      .roll { animation: roll 6s linear infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      @keyframes flick { 0%,92%,100% { opacity: 1; } 93% { opacity: .55; } 95% { opacity: .9; } 97% { opacity: .6; } }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes ping { 0%,60% { transform: scale(.2); opacity: 0; } 65% { opacity: 1; } 100% { transform: scale(2.4); opacity: 0; } }
      @keyframes hover { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
      @keyframes tw { 0%,100% { opacity: .25; } 50% { opacity: 1; } }
      @keyframes roll { from { transform: translateY(-40px); } to { transform: translateY(340px); } }
    </style>
  </defs>

  <!-- screen -->
  <rect width="1000" height="300" rx="18" fill="url(#crt)"/>

  <!-- starfield -->
  <g fill="#39ff7a">
    <circle class="star" cx="60" cy="40" r="1.4"/>
    <circle class="star s2" cx="190" cy="260" r="1.2"/>
    <circle class="star s3" cx="320" cy="30" r="1.1"/>
    <circle class="star" cx="470" cy="270" r="1.3"/>
    <circle class="star s2" cx="610" cy="25" r="1.2"/>
    <circle class="star s3" cx="700" cy="270" r="1"/>
    <circle class="star s2" cx="960" cy="40" r="1.3"/>
    <circle class="star" cx="955" cy="265" r="1.1"/>
  </g>

  <g class="flick" filter="url(#glow)">
    <!-- top status bar -->
    <text x="40" y="44" class="t dim" font-size="14" letter-spacing="2">DEEP SPACE RELAY // CH-07 // FREQ 1420.4 MHz</text>
    <text x="40" y="70" class="t amber" font-size="14" letter-spacing="2">&gt; INCOMING TRANSMISSION . . . DECODED</text>

    <!-- name -->
    <text x="40" y="150" class="t" font-size="58" font-weight="bold" letter-spacing="6">TIMOTHY ITAYI</text>
    <text x="40" y="190" class="t" font-size="18" letter-spacing="3">IDENTITY &amp; ACCESS MANAGEMENT</text>
    <text x="40" y="216" class="t dim" font-size="15" letter-spacing="2">OKTA · ENTRA ID · ACTIVE DIRECTORY · AZURE · POWERSHELL</text>

    <text x="40" y="262" class="t" font-size="15" letter-spacing="2">STATUS: SEEKING EARTH-BASED EMPLOYMENT<tspan class="blink"> █</tspan></text>

    <!-- radar -->
    <g fill="none" stroke="#1f8f47" stroke-width="1.2">
      <circle cx="830" cy="150" r="95"/>
      <circle cx="830" cy="150" r="63"/>
      <circle cx="830" cy="150" r="31"/>
      <line x1="735" y1="150" x2="925" y2="150"/>
      <line x1="830" y1="55" x2="830" y2="245"/>
    </g>
    <g class="rot">
      <path d="M830 150 L925 150 A95 95 0 0 0 897 83 Z" fill="url(#sweep)"/>
      <line x1="830" y1="150" x2="925" y2="150" stroke="#39ff7a" stroke-width="2"/>
    </g>
    <circle class="ping" cx="862" cy="118" r="6" fill="none" stroke="#ffb000" stroke-width="2"/>
    <circle cx="862" cy="118" r="3" fill="#ffb000"/>

    <!-- original saucer glyph -->
    <g class="ufo" transform="translate(645 92)">
      <ellipse cx="0" cy="0" rx="16" ry="11" fill="none" stroke="#39ff7a" stroke-width="2"/>
      <ellipse cx="0" cy="8" rx="44" ry="10" fill="#06180c" stroke="#39ff7a" stroke-width="2"/>
      <circle cx="-24" cy="8" r="2.2" fill="#ffb000" class="blink"/>
      <circle cx="0" cy="11" r="2.2" fill="#ffb000"/>
      <circle cx="24" cy="8" r="2.2" fill="#ffb000" class="blink"/>
      <path d="M-14 20 L-26 58 L26 58 L14 20 Z" fill="#39ff7a" opacity="0.12"/>
    </g>
  </g>

  <!-- CRT overlays -->
  <rect class="roll" x="0" y="0" width="1000" height="30" fill="#39ff7a" opacity="0.04"/>
  <rect width="1000" height="300" rx="18" fill="url(#scan)"/>
  <rect x="3" y="3" width="994" height="294" rx="16" fill="none" stroke="#1f8f47" stroke-width="2"/>
</svg>
